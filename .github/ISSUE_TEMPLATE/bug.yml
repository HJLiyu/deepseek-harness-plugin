name: 问题反馈 / Bug
description: 报告卡点、接入错误或界面问题（请勿包含凭据）
body:
  - type: textarea
    id: versions
    attributes:
      label: 系统及版本 / Environment
      description: OS、Node、Codex、Harness、API/CLI 接入方式
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤与期望 / Reproduction
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果与已脱敏错误 / Actual result
      description: 不要粘贴 API key、Cookie、完整聊天或页面 URL 的 # 片段。
    validations:
      required: true
