name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  node:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/check.mjs
      - run: node --test --test-concurrency=4 tests/*.test.mjs
