<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>模型接入 · Codex × Harness</title>
<style>
:root{font:15px/1.6 system-ui,sans-serif;color:#242424;background:#f9f9f9;color-scheme:light dark}*{box-sizing:border-box}body{margin:0}main{max-width:1050px;margin:auto;padding:28px}header{display:flex;align-items:center;justify-content:space-between;gap:20px}h1{font-size:25px;margin:12px 0}h2{font-size:18px;margin:0 0 14px}p{color:#666}a{color:inherit;display:inline-flex;align-items:center;min-height:44px}button,input,select,textarea{font:inherit;min-height:44px;border:1px solid #d9d9d9;border-radius:9px;padding:9px 12px;color:inherit;background:#fff}button{cursor:pointer}button:disabled{opacity:.5;cursor:wait}button.primary{background:#222;color:#fff}input,select,textarea{width:100%}textarea{min-height:90px;resize:vertical}label{display:block;margin-bottom:16px}label small{display:block;color:#666}section{border:1px solid #e3e3e3;border-radius:16px;padding:24px;background:#fff}.layout{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:24px;margin-top:24px}.actions{display:flex;gap:8px;flex-wrap:wrap}.card{border-top:1px solid #ddd;padding:16px 0}.card strong{display:block;overflow-wrap:anywhere}.card p{margin:4px 0 12px;font-size:13px;overflow-wrap:anywhere}.note{font-size:13px;color:#666}#feedback{white-space:pre-wrap;overflow-wrap:anywhere;min-height:30px;padding:12px 0}select:focus-visible,input:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid #3a7afe;outline-offset:3px}[hidden]{display:none!important}@media(max-width:760px){main{padding:16px}.layout{grid-template-columns:1fr}section{padding:18px}header{align-items:flex-start}}@media(prefers-color-scheme:dark){:root{color:#e9e9e9;background:#181818}section,button,input,select,textarea{background:#232323;border-color:#444}p,.note,label small{color:#aaa}button.primary{color:#222;background:#eee}}
</style>
<main><header><div><h1>模型接入</h1><p>选择服务、测试连接，再把它加入新群。已有群的上下文保持固定。</p></div><a id="back" href="/">返回群聊</a></header>
<div class="layout"><section><h2>新增 AI 伙伴</h2><form id="connectionForm" autocomplete="off">
<label>接入方式<select id="preset" name="preset"></select></label><label>显示名称<input id="name" name="name" maxlength="80" required></label>
<div id="apiFields"><label>API 基础地址<input id="baseUrl" name="baseUrl" type="url" placeholder="https://example.com/v1"><small>填写包含 /v1 的兼容基础地址；本机服务可用 HTTP。</small></label>
<label>密钥保存方式<select id="auth" name="auth"><option value="env">引用环境变量（推荐）</option><option value="local">本机加密保存（Windows 当前用户）</option><option value="none">无需密钥</option></select></label>
<label id="envField">环境变量名称<input id="keyEnv" name="keyEnv" placeholder="DEEPSEEK_API_KEY"><small>使用服务进程启动时继承的变量；不要在这里填写密钥。</small></label>
<label id="keyField" hidden>API 密钥<input id="apiKey" name="apiKey" type="password" autocomplete="new-password"><small>仅提交到本机服务加密保存，不回显、不存浏览器。</small></label></div>
<div id="cliFields" hidden><label>可执行文件绝对路径<input id="binary" name="binary" placeholder="C:\…\codex.exe"></label><label>参数（JSON 字符串数组）<textarea id="args" name="args" spellcheck="false">[]</textarea><small>直接启动子进程，不通过 shell；Node CLI 选择 node.exe，并把脚本路径放在参数第一项。</small></label><button id="detect" type="button">自动查找本机 CLI</button><p class="note">CLI 使用自己的登录态与原生沙箱。Harness ACP 需支持 session/resume 或 session/load；独立进程加载宿主阶段权限预设，计划与复核只读，工作需审批。</p></div>
<label>默认模型<input id="model" name="model" placeholder="可先保存，再读取模型目录" list="models"><datalist id="models"></datalist></label>
<button class="primary" type="submit">保存新连接</button><p class="note">地址、程序或模型更改时保存为新连接，避免影响已有群。项目内文件工具可直接写入；API 任意命令和越界文件访问需真人单次批准。原生 CLI 的文件隔离范围由其宿主沙箱决定。</p>
</form><div id="feedback" role="status" aria-live="polite"></div></section>
<section><h2>已保存的连接</h2><p class="note">“检测与模型目录”不调用模型推理。API“测试对话”发送一条短消息，可能计费；CLI 推理在专用群中测试。</p><div id="saved"></div></section></div></main>
<script>
const $=id=>document.getElementById(id),token=location.hash.slice(1);let presets=[],connections=[];
$('back').href='/#'+token;
async function api(route,body){const r=await fetch('/api/connections'+route,{method:body?'POST':'GET',headers:{authorization:'Bearer '+token,...(body?{'content-type':'application/json'}:{})},body:body?JSON.stringify(body):undefined});const v=await r.json();if(!r.ok)throw Error(v.error||'请求失败');return v;}
function feedback(v){$('feedback').textContent=v;}
function fields(){const p=presets.find(p=>p.id===$('preset').value);$('apiFields').hidden=p.kind!=='api';$('cliFields').hidden=p.kind==='api';$('envField').hidden=$('auth').value!=='env';$('keyField').hidden=$('auth').value!=='local';}
function preset(){const p=presets.find(p=>p.id===$('preset').value);for(const k of ['name','baseUrl','model','keyEnv'])$(k).value=p[k]||'';$('auth').value=p.auth||'env';$('apiKey').value='';fields();feedback('');}
async function busy(b,fn){b.disabled=true;try{await fn();}catch(e){feedback(e.message);}finally{b.disabled=false;}}
async function load(){const v=await api('');presets=v.presets;connections=v.connections;if(!$('preset').options.length){for(const p of presets)$('preset').add(new Option(p.name,p.id));preset();}render();}
function render(){const host=$('saved');host.replaceChildren();if(!connections.length){host.textContent='尚无连接。原生 Harness 接入仍可直接使用。';return;}
for(const c of connections){const card=document.createElement('div');card.className='card';const title=document.createElement('strong');title.textContent=c.name;const detail=document.createElement('p');detail.textContent=[c.kind,c.baseUrl||c.binary,c.model||'建群时选择模型',c.auth==='env'?'密钥：环境变量 '+c.keyEnv:c.auth==='local'?'密钥：本机加密':''].filter(Boolean).join(' · ');card.append(title,detail);const actions=document.createElement('div');actions.className='actions';
for(const [label,dialogue] of [['检测与模型目录',false],...(c.kind==='api'?[['测试对话（可能计费）',true]]:[])]){const b=document.createElement('button');b.type='button';b.textContent=label;b.onclick=()=>busy(b,async()=>{feedback('正在检测 '+c.name+'…');const r=await api('/test',{id:c.id,dialogue,model:c.model||$('model').value});if(dialogue){feedback('短对话成功。用量：'+(r.usage?JSON.stringify(r.usage):'服务未提供'));return;}$('models').replaceChildren();for(const m of r.models||[]){const o=document.createElement('option');o.value=m.id;o.label=m.name||m.id;$('models').append(o);}feedback('协议连接成功。发现 '+(r.models||[]).length+' 个模型。'+((r.models||[]).map(m=>m.name||m.id).join('、')||'未提供模型目录，可在建群时手动填写。'));});actions.append(b);}
const use=document.createElement('a');use.href='/#'+token;use.textContent='在新群中选择此连接 ↗';actions.append(use);card.append(actions);host.append(card);}}
$('preset').onchange=preset;$('auth').onchange=fields;
$('detect').onclick=e=>busy(e.target,async()=>{const p=presets.find(p=>p.id===$('preset').value),v=await api('/detect',{kind:p.kind});$('binary').value=v.binary;$('args').value=JSON.stringify(v.args,null,2);feedback(v.binary?'已填入可执行文件及参数，请核对后保存。':'未找到 CLI，请手动指定可执行文件。');});
$('connectionForm').onsubmit=e=>{e.preventDefault();busy(e.submitter,async()=>{const p=presets.find(p=>p.id===$('preset').value),v={preset:p.id,name:$('name').value,model:$('model').value};if(p.kind==='api')Object.assign(v,{baseUrl:$('baseUrl').value,auth:$('auth').value,keyEnv:$('keyEnv').value,apiKey:$('apiKey').value});else Object.assign(v,{binary:$('binary').value,args:JSON.parse($('args').value)});try{const saved=await api('',v);await load();feedback('已保存 '+saved.name+'。可先检测连接，再返回群聊，在“新建项目群”选择该伙伴。');}finally{$('apiKey').value='';delete v.apiKey;}});};
load().catch(e=>feedback(e.message));
</script></html>
